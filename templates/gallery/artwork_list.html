{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4">Obras</h1>

    <div class="row">
        {% for artwork in artworks %}
            <div class="col-md-4 mb-4">
                <h2 class="h5">{{ artwork.title }}</h2>
                <p>{{ artwork.artist.name }}</p>
                <a href="{% url 'gallery:artwork_detail' artwork.slug %}">Ver detalhes</a>
            </div>
        {% empty %}
            <p class="col-12">Nenhuma obra cadastrada.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
