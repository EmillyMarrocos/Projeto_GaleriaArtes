{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <h1>{{ artwork.title }}</h1>
    <p>{{ artwork.artist.name }}</p>
    <p>{{ artwork.description }}</p>

    {% if review_form %}
        <form method="post" class="mt-4">
            {% csrf_token %}
            {{ review_form.as_p }}
            <button type="submit" class="btn btn-outline-custom">Avaliar</button>
        </form>
    {% endif %}
</div>
{% endblock %}
